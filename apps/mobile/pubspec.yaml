name: cricapp
description: "CricApp - Cricket scoring app for amateur cricketers"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^17.1.0

  # Code generation (Freezed)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local database
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.41

  # Networking
  dio: ^5.9.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4

  # Storage
  flutter_secure_storage: ^10.0.0

  # Image
  image_picker: ^1.2.1

  # Logging
  logger: ^2.6.2

  # SMS auto-read
  smart_auth: ^3.2.0

  # Utils
  uuid: ^4.5.2
  intl: ^0.20.2
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.11.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0
  drift_dev: ^2.31.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
