name: Bug Report
description: Report a bug or incorrect behavior
labels: ["type: bug", "status: needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear, concise description of the bug
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happens
      placeholder: What actually happened instead?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - Critical (app crash, data loss, scoring incorrect)
        - P1 - High (feature broken, workaround exists)
        - P2 - Medium (minor incorrect behavior)
        - P3 - Low (cosmetic, edge case)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Device model
      placeholder: e.g., Samsung Galaxy A12

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: e.g., 12

  - type: input
    id: ram
    attributes:
      label: RAM
      placeholder: e.g., 3GB

  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: e.g., 0.1.0

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Recordings
      description: Attach screenshots or screen recordings if UI-related

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information, logs, or error messages
