<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
  }
  .container {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #0D47A1 0%, #1565C0 30%, #1976D2 60%, #1E88E5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* Subtle pattern overlay */
  .pattern {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(255,255,255,0.05) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 50%);
  }
  /* Cricket ball decorative element */
  .ball {
    position: absolute;
    right: -40px;
    top: -40px;
    width: 280px;
    height: 280px;
    background: rgba(198, 40, 40, 0.3);
    border-radius: 50%;
    border: 6px solid rgba(255,255,255,0.15);
  }
  .ball2 {
    position: absolute;
    left: -60px;
    bottom: -80px;
    width: 220px;
    height: 220px;
    background: rgba(198, 40, 40, 0.2);
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.1);
  }
  /* Content */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: white;
  }
  /* Cricket ball icon inline */
  .icon-ball {
    width: 80px;
    height: 80px;
    background: #C62828;
    border-radius: 50%;
    margin: 0 auto 20px;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .icon-ball::before, .icon-ball::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 50px;
    border: 3px solid rgba(255,255,255,0.9);
    border-radius: 50%;
    top: 15px;
  }
  .icon-ball::before {
    left: 18px;
    border-right: none;
  }
  .icon-ball::after {
    right: 18px;
    border-left: none;
  }
  .app-name {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 12px;
  }
  .app-name span {
    color: #FFCA28;
  }
  .tagline {
    font-size: 24px;
    font-weight: 400;
    opacity: 0.9;
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  /* Bottom accent line */
  .accent-line {
    width: 80px;
    height: 4px;
    background: #FFCA28;
    border-radius: 2px;
    margin: 20px auto 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="pattern"></div>
  <div class="ball"></div>
  <div class="ball2"></div>
  <div class="content">
    <div class="icon-ball"></div>
    <div class="app-name">Cric<span>Scores</span></div>
    <div class="tagline">Score Cricket Like a Pro</div>
    <div class="accent-line"></div>
  </div>
</div>
</body>
</html>
