<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricApp — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="page-content no-bottom-nav" style="display: flex; flex-direction: column;">

      <!-- Top section with branding -->
      <div style="text-align: center; padding-top: 60px; margin-bottom: 48px;">
        <!-- Cricket ball icon -->
        <div style="margin-bottom: 20px;">
          <svg width="56" height="56" viewBox="0 0 72 72" fill="none" style="display: inline-block;">
            <circle cx="36" cy="36" r="34" fill="#C62828" stroke="#A01A1A" stroke-width="2"/>
            <path d="M20 18C26 28 26 44 20 54" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M52 18C46 28 46 44 52 54" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <line x1="18" y1="22" x2="22" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="17" y1="28" x2="21" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="17" y1="34" x2="21" y2="34" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="17" y1="40" x2="21" y2="40" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="18" y1="46" x2="22" y2="45" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="54" y1="22" x2="50" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="55" y1="28" x2="51" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="55" y1="34" x2="51" y2="34" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="55" y1="40" x2="51" y2="40" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="54" y1="46" x2="50" y2="45" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="app-logo" style="margin-bottom: 8px;">Cric<span>App</span></div>
        <p style="color: var(--text-secondary); font-size: var(--body);">Enter your phone number to continue</p>
      </div>

      <!-- Phone Input -->
      <div style="padding: 0 8px;">
        <div class="input-group">
          <label class="input-label">Phone Number</label>
          <div class="input-row">
            <button class="input-prefix" id="countryCodeBtn" onclick="toggleCountryPicker()" style="cursor: pointer; gap: 6px; border: none; background: var(--surface); padding: 0 12px; font-size: var(--body); font-weight: var(--fw-medium); color: var(--text-secondary); border-right: 1px solid var(--border); height: 100%; display: flex; align-items: center;">
              <span id="countryFlag" style="font-size: 18px;">🇮🇳</span>
              <span id="countryCode">+91</span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M5 6L0 0h10z"/></svg>
            </button>
            <input type="tel" class="input-field" id="phoneInput" placeholder="98765 43210" maxlength="12" autocomplete="tel">
          </div>
          <span class="input-error" id="phoneError"></span>
        </div>

        <!-- Country Code Picker (hidden by default) -->
        <div id="countryPicker" style="display: none; margin-top: 8px; border: 1.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; max-height: 240px;">
          <div style="padding: 8px; border-bottom: 1px solid var(--border);">
            <input type="text" id="countrySearch" class="input-field" placeholder="Search country..." style="height: 40px; font-size: var(--body-sm);" oninput="filterCountries()">
          </div>
          <div id="countryList" style="overflow-y: auto; max-height: 192px;">
            <!-- Popular countries shown by default; full list filterable -->
          </div>
        </div>
      </div>

      <!-- Spacer -->
      <div style="flex: 1;"></div>

      <!-- CTA Button -->
      <div style="padding: 0 8px 32px;">
        <button class="btn btn-primary" id="sendOtpBtn" onclick="handleSendOtp()">Send OTP</button>
        <p style="text-align: center; margin-top: 16px; font-size: var(--caption); color: var(--text-secondary);">
          By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const phoneInput = document.getElementById('phoneInput');
    const phoneError = document.getElementById('phoneError');

    // Country data (popular countries for cricket-playing nations)
    const countries = [
      { flag: '🇮🇳', name: 'India', code: '+91' },
      { flag: '🇵🇰', name: 'Pakistan', code: '+92' },
      { flag: '🇧🇩', name: 'Bangladesh', code: '+880' },
      { flag: '🇱🇰', name: 'Sri Lanka', code: '+94' },
      { flag: '🇦🇺', name: 'Australia', code: '+61' },
      { flag: '🇬🇧', name: 'United Kingdom', code: '+44' },
      { flag: '🇿🇦', name: 'South Africa', code: '+27' },
      { flag: '🇳🇿', name: 'New Zealand', code: '+64' },
      { flag: '🇦🇪', name: 'UAE', code: '+971' },
      { flag: '🇺🇸', name: 'United States', code: '+1' },
      { flag: '🇨🇦', name: 'Canada', code: '+1' },
      { flag: '🇳🇵', name: 'Nepal', code: '+977' },
      { flag: '🇦🇫', name: 'Afghanistan', code: '+93' },
      { flag: '🇿🇼', name: 'Zimbabwe', code: '+263' },
      { flag: '🇮🇪', name: 'Ireland', code: '+353' },
      { flag: '🇰🇪', name: 'Kenya', code: '+254' },
      { flag: '🇴🇲', name: 'Oman', code: '+968' },
      { flag: '🇸🇬', name: 'Singapore', code: '+65' },
      { flag: '🇭🇰', name: 'Hong Kong', code: '+852' },
      { flag: '🇲🇾', name: 'Malaysia', code: '+60' },
    ];

    function renderCountryList(filter = '') {
      const list = document.getElementById('countryList');
      const filtered = filter
        ? countries.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()) || c.code.includes(filter))
        : countries;
      list.innerHTML = filtered.map(c => `
        <div onclick="selectCountry('${c.flag}', '${c.code}')" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: background 0.15s;" onmouseover="this.style.background='var(--surface)'" onmouseout="this.style.background='transparent'">
          <span style="font-size: 20px;">${c.flag}</span>
          <span style="flex: 1; font-size: var(--body-sm);">${c.name}</span>
          <span style="font-size: var(--body-sm); color: var(--text-secondary);">${c.code}</span>
        </div>
      `).join('');
    }

    function toggleCountryPicker() {
      const picker = document.getElementById('countryPicker');
      const isOpen = picker.style.display !== 'none';
      picker.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) {
        renderCountryList();
        document.getElementById('countrySearch').value = '';
        document.getElementById('countrySearch').focus();
      }
    }

    function filterCountries() {
      renderCountryList(document.getElementById('countrySearch').value);
    }

    function selectCountry(flag, code) {
      document.getElementById('countryFlag').textContent = flag;
      document.getElementById('countryCode').textContent = code;
      document.getElementById('countryPicker').style.display = 'none';
      phoneInput.focus();
    }

    // Format phone number as user types
    phoneInput.addEventListener('input', () => {
      clearInputError(phoneInput);
      // Strip non-digits
      let val = phoneInput.value.replace(/\D/g, '');
      if (val.length > 10) val = val.substring(0, 10);
      // Add space after 5th digit
      if (val.length > 5) {
        val = val.substring(0, 5) + ' ' + val.substring(5);
      }
      phoneInput.value = val;
    });

    function handleSendOtp() {
      const raw = phoneInput.value.replace(/\s/g, '');
      if (!validatePhone(raw)) {
        showInputError(phoneInput, 'Please enter a valid 10-digit phone number');
        return;
      }
      navigateTo('03-otp.html');
    }

    // Submit on Enter
    phoneInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSendOtp();
    });

    // Close picker when clicking outside
    document.addEventListener('click', (e) => {
      const picker = document.getElementById('countryPicker');
      const btn = document.getElementById('countryCodeBtn');
      if (!picker.contains(e.target) && !btn.contains(e.target)) {
        picker.style.display = 'none';
      }
    });
  </script>
</body>
</html>
