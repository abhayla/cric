<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricApp — Teams</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Team grid styles now in styles.css -->
</head>
<body>
  <div class="phone-frame">
    <!-- Header -->
    <div class="header-bar">
      <button class="back-btn" onclick="goBack('05-home.html')">
        <span data-icon="back"></span>
      </button>
      <span class="header-title">My Teams</span>
    </div>

    <!-- Content -->
    <div class="page-content">
      <div class="team-grid">
        <!-- Team 1 -->
        <div class="team-grid-card" onclick="navigateTo('08-team-detail.html')">
          <div class="team-avatar" style="background: #E3F2FD; color: #1565C0;">MW</div>
          <div class="team-grid-name">Mumbai Warriors</div>
          <div class="team-grid-meta">11 players · Mumbai</div>
          <div class="team-grid-role">Owner</div>
        </div>

        <!-- Team 2 -->
        <div class="team-grid-card" onclick="navigateTo('08-team-detail.html')">
          <div class="team-avatar" style="background: #FCE4EC; color: #C62828;">DS</div>
          <div class="team-grid-name">Delhi Strikers</div>
          <div class="team-grid-meta">11 players · Delhi</div>
          <div class="team-grid-role">Captain</div>
        </div>

        <!-- Team 3 -->
        <div class="team-grid-card" onclick="navigateTo('08-team-detail.html')">
          <div class="team-avatar" style="background: #E8F5E9; color: #2E7D32;">CK</div>
          <div class="team-grid-name">Chennai Kings</div>
          <div class="team-grid-meta">9 players · Chennai</div>
          <div class="team-grid-role">Member</div>
        </div>

        <!-- Team 4 -->
        <div class="team-grid-card" onclick="navigateTo('08-team-detail.html')">
          <div class="team-avatar" style="background: #FFF3E0; color: #E65100;">BR</div>
          <div class="team-grid-name">Bangalore Royals</div>
          <div class="team-grid-meta">11 players · Bangalore</div>
          <div class="team-grid-role">Member</div>
        </div>

        <!-- Team 5 -->
        <div class="team-grid-card" onclick="navigateTo('08-team-detail.html')">
          <div class="team-avatar" style="background: #F3E5F5; color: #6A1B9A;">KT</div>
          <div class="team-grid-name">Kolkata Thunder</div>
          <div class="team-grid-meta">10 players · Kolkata</div>
          <div class="team-grid-role">Owner</div>
        </div>
      </div>
    </div>

    <!-- Empty State (G24) — toggle: document.getElementById('emptyState').style.display = '' -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-icon" data-icon="groups" style="font-size: 64px; opacity: 0.38;"></div>
      <div class="empty-title">No Teams Yet</div>
      <div class="empty-text">Create your first team to get started.</div>
      <button class="empty-cta" onclick="navigateTo('07-create-team.html')">Create a Team</button>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="navigateTo('07-create-team.html')" title="Create Team">
      <span data-icon="plus" style="width: 24px; height: 24px;"></span>
    </button>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script src="app.js"></script>
  <script>initBottomNav('mycricket');</script>
</body>
</html>
