<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricApp — Match Complete</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .phone-frame { display: flex; flex-direction: column; }
    .score-comparison {
      background: var(--header); color: white; padding: 20px 16px; text-align: center;
    }
    .score-comparison .teams-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .score-comparison .team-block { text-align: center; flex: 1; }
    .score-comparison .team-block .team-avatar-lg {
      width: 48px; height: 48px; border-radius: 50%;
      margin: 0 auto 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
    }
    .score-comparison .team-block .team-short { font-size: var(--body-sm); color: rgba(255,255,255,0.7); }
    .score-comparison .team-block .team-total { font-size: var(--score-md); font-weight: 700; margin-top: 4px; }
    .score-comparison .team-block .team-overs-label { font-size: var(--caption); color: rgba(255,255,255,0.5); }
    .score-comparison .vs { font-size: var(--body-sm); font-weight: 600; color: rgba(255,255,255,0.5); }
    .result-text {
      text-align: center; padding: 16px;
      font-size: var(--heading); font-weight: var(--fw-bold); color: var(--primary-dark);
    }
    .match-complete-actions {
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Dimmed scoring backdrop -->
    <div style="background: var(--header); padding: 12px 16px; color: white; opacity: 0.5;">
      <div style="font-size: var(--caption); color: rgba(255,255,255,0.7);">Delhi Strikers — 2nd Innings</div>
      <div style="font-size: var(--score-lg); font-weight: 700;">172/9 <span style="font-size: var(--body-sm); color: rgba(255,255,255,0.5);">(20.0)</span></div>
    </div>

    <!-- Match Complete Modal overlay -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; background: var(--overlay); padding: 16px;">
      <div class="modal" style="width: 100%;">
        <div class="modal-header" style="background: var(--primary-light); border-bottom: none;">
          <span class="modal-title" style="color: var(--primary-dark); width: 100%; text-align: center;">Match Complete!</span>
        </div>

        <div class="modal-body" style="padding: 0;">
          <!-- Score Comparison -->
          <div class="score-comparison">
            <div class="teams-row">
              <div class="team-block">
                <div class="team-avatar-lg" style="background: #E3F2FD; color: #1565C0;">MW</div>
                <div class="team-short">Mumbai Warriors</div>
                <div class="team-total">187/6</div>
                <div class="team-overs-label">(20.0 ov)</div>
              </div>
              <div class="vs">VS</div>
              <div class="team-block">
                <div class="team-avatar-lg" style="background: #FCE4EC; color: #C62828;">DS</div>
                <div class="team-short">Delhi Strikers</div>
                <div class="team-total">172/9</div>
                <div class="team-overs-label">(20.0 ov)</div>
              </div>
            </div>
          </div>

          <!-- Result Text -->
          <div class="result-text" id="resultText">Mumbai Warriors won by 15 runs</div>

          <!-- Super Over Button (hidden by default — toggle via JS for tied knockout) -->
          <div id="superOverBtn" style="display: none; padding: 0 16px 8px;">
            <button class="btn btn-outline w-full" onclick="navigateTo('27-super-over-setup.html')">Start Super Over</button>
          </div>
        </div>

        <div class="match-complete-actions">
          <button class="btn btn-primary" onclick="navigateTo('15-scorecard.html')">View Scorecard</button>
          <button class="btn btn-outline w-full" onclick="navigateTo('05-home.html')">Back to Home</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Toggle tied knockout state to demo Super Over button:
    // Set tiedKnockout = true to show "Start Super Over"
    let tiedKnockout = false;
    function toggleTiedState() {
      tiedKnockout = !tiedKnockout;
      document.getElementById('superOverBtn').style.display = tiedKnockout ? '' : 'none';
      document.getElementById('resultText').textContent = tiedKnockout
        ? 'Match Tied — Super Over required'
        : 'Mumbai Warriors won by 15 runs';
    }
    // Uncomment to demo tied state:
    // toggleTiedState();
  </script>
</body>
</html>
