<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricApp — More</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .list-tile {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; border-bottom: 1px solid var(--divider);
      cursor: pointer; transition: background var(--duration) var(--ease);
    }
    .list-tile:hover { background: var(--surface); }
    .list-tile:last-child { border-bottom: none; }
    .list-tile-icon {
      width: 40px; height: 40px; border-radius: var(--radius-full);
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .list-tile-icon span { width: 20px; height: 20px; }
    .list-tile-label { flex: 1; font-size: var(--body); font-weight: var(--fw-medium); color: var(--text-primary); }
    .list-tile-trailing { width: 20px; height: 20px; color: var(--text-secondary); flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Header -->
    <div class="header-bar">
      <span class="header-title">More</span>
    </div>

    <!-- Page Content -->
    <div class="page-content">
      <div class="list-tile" onclick="navigateTo('19-tournaments-list.html')">
        <div class="list-tile-icon">
          <span data-icon="trophy"></span>
        </div>
        <span class="list-tile-label">Tournaments</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>

      <div class="list-tile" onclick="alert('Settings coming soon')">
        <div class="list-tile-icon">
          <span data-icon="settings"></span>
        </div>
        <span class="list-tile-label">Settings</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>

      <div class="list-tile" onclick="alert('About coming soon')">
        <div class="list-tile-icon">
          <span data-icon="info"></span>
        </div>
        <span class="list-tile-label">About</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>

      <div class="list-tile" onclick="alert('Help coming soon')">
        <div class="list-tile-icon">
          <span data-icon="help"></span>
        </div>
        <span class="list-tile-label">Help</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script src="app.js"></script>
  <script>
    initBottomNav('more');
  </script>
</body>
</html>
