<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CricScores — More</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <!-- Header -->
    <div class="header-bar">
      <span class="header-title">More</span>
    </div>

    <!-- Page Content -->
    <div class="page-content">
      <!-- Search Bar -->
      <div class="search-bar" style="margin-bottom: 16px;">
        <span class="search-icon" data-icon="search" style="width: 20px; height: 20px;"></span>
        <input type="text" placeholder="Search teams, matches, tournaments">
      </div>

      <!-- My Profile -->
      <div class="list-tile" onclick="navigateTo('17-player-profile.html')">
        <div class="list-tile-icon">
          <span data-icon="profile"></span>
        </div>
        <span class="list-tile-label">My Profile</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>

      <!-- Settings -->
      <div class="list-tile" onclick="alert('Settings coming soon')">
        <div class="list-tile-icon">
          <span data-icon="settings"></span>
        </div>
        <span class="list-tile-label">Settings</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>

      <!-- About -->
      <div class="list-tile" onclick="alert('About coming soon')">
        <div class="list-tile-icon">
          <span data-icon="info"></span>
        </div>
        <span class="list-tile-label">About</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>

      <!-- Help -->
      <div class="list-tile" onclick="alert('Help coming soon')">
        <div class="list-tile-icon">
          <span data-icon="help"></span>
        </div>
        <span class="list-tile-label">Help</span>
        <span class="list-tile-trailing" data-icon="chevronRight"></span>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script src="app.js"></script>
  <script>
    initBottomNav('more');
  </script>
</body>
</html>
